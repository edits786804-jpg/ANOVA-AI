plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anova.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.anova.ai'
        minSdk 25
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
